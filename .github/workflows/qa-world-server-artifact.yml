name: QA runtime artifacts

on:
  workflow_dispatch:
    inputs:
      studio_validation:
        description: Validate the native ARM target in a disposable Linux VM
        type: boolean
        default: false
  pull_request:
    branches:
      - "3.4.3"
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build replica ${{ matrix.replica }}
    if: (github.event_name == 'workflow_dispatch' && inputs.studio_validation) || contains(github.event.pull_request.labels.*.name, 'qa-artifact')
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.studio_validation && github.repository == 'jarlbrak/rustycore') && fromJSON('["self-hosted","ARM64","studio-services"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica:
          - a
          - b

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust
        # This is dtolnay/rust-toolchain's generated 1.88.0 commit: its
        # action.yml embeds `env.toolchain: 1.88.0` and exposes no toolchain
        # input. The immutable SHA therefore retains the former @1.88.0 pin.
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: qa-world-server-${{ matrix.replica }}
          workspaces: |
            . -> target
            tools/wow-test-bot -> target

      - name: Install protoc
        run: bash tools/ci/install-protoc.sh

      - name: Build no-LTO release artifacts
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          RUST_MIN_STACK: "268435456"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo +1.88.0 build --locked --release -p world-server --bin world-server
          cargo +1.88.0 build --locked --release \
            --manifest-path tools/wow-test-bot/Cargo.toml \
            --bin wow-test-bot

      - name: Package provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPLICA: ${{ matrix.replica }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$HEAD_SHA"
          install -D -m 0755 target/release/world-server qa-artifact/world-server
          install -D -m 0755 tools/wow-test-bot/target/release/wow-test-bot qa-artifact/wow-test-bot
          sha256sum qa-artifact/world-server | awk '{print $1}' > qa-artifact/world-server.sha256
          sha256sum qa-artifact/wow-test-bot | awk '{print $1}' > qa-artifact/wow-test-bot.sha256
          rustc +1.88.0 --version --verbose > qa-artifact/rustc-version.txt
          printf '%s\n' "$actual_head" > qa-artifact/git-head.txt
          printf '%s\n' "$REPLICA" > qa-artifact/replica.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-server-qa-${{ matrix.replica }}-${{ github.event.pull_request.head.sha }}
          path: qa-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify:
    name: Verify replica hashes
    if: (github.event_name == 'workflow_dispatch' && inputs.studio_validation) || contains(github.event.pull_request.labels.*.name, 'qa-artifact')
    needs: build
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.studio_validation && github.repository == 'jarlbrak/rustycore') && fromJSON('["self-hosted","ARM64","studio-services"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5

    steps:
      - name: Download replicas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: world-server-qa-*-${{ github.event.pull_request.head.sha }}
          path: replicas

      - name: Require identical artifacts and provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          replica_a="replicas/world-server-qa-a-${HEAD_SHA}"
          replica_b="replicas/world-server-qa-b-${HEAD_SHA}"
          test "$(cat "${replica_a}/git-head.txt")" = "$HEAD_SHA"
          test "$(cat "${replica_b}/git-head.txt")" = "$HEAD_SHA"
          test "$(sha256sum "${replica_a}/world-server" | awk '{print $1}')" = "$(cat "${replica_a}/world-server.sha256")"
          test "$(sha256sum "${replica_b}/world-server" | awk '{print $1}')" = "$(cat "${replica_b}/world-server.sha256")"
          test "$(sha256sum "${replica_a}/wow-test-bot" | awk '{print $1}')" = "$(cat "${replica_a}/wow-test-bot.sha256")"
          test "$(sha256sum "${replica_b}/wow-test-bot" | awk '{print $1}')" = "$(cat "${replica_b}/wow-test-bot.sha256")"
          cmp "${replica_a}/world-server" "${replica_b}/world-server"
          cmp "${replica_a}/wow-test-bot" "${replica_b}/wow-test-bot"
          install -D -m 0755 "${replica_a}/world-server" verified/world-server
          install -D -m 0755 "${replica_a}/wow-test-bot" verified/wow-test-bot
          cp "${replica_a}/world-server.sha256" verified/world-server.sha256
          cp "${replica_a}/wow-test-bot.sha256" verified/wow-test-bot.sha256
          cp "${replica_a}/rustc-version.txt" verified/rustc-version.txt
          cp "${replica_a}/git-head.txt" verified/git-head.txt

      - name: Upload verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-server-qa-verified-${{ github.event.pull_request.head.sha }}
          path: verified/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
